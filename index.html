<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple To-Do Memo</title>
<style>
@font-face {
  font-family: 'Pretendard Variable';
  src: url('assets/Pretendard-Variable.woff2') format('woff2-variations');
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg:            #f5f5f3;
  --surface:       #ffffff;
  --surface-hover: #fafaf9;
  --border:        #e7e7e2;
  --border-strong: #d6d6cf;
  --text:          #1c1c1a;
  --text-2:        #71716b;
  --text-3:        #a3a39c;
  --accent:        #0e7490;
  --accent-hover:  #155e75;
  --accent-soft:   #e6f4f8;
  --accent-line:   #cbe2ea;
  --today-bg:      #e4eef2;
  --today-wash:    rgba(14, 116, 144, .13);
  --accent-wash:   rgba(14, 116, 144, .12);
  --accent-ring:   rgba(14, 116, 144, .18);
  --red:           #b8564d;
  --blue:          #3d6ba8;
  --holiday:       rgba(184, 86, 77, .08);
  --holiday-hover: rgba(184, 86, 77, .15);
  --tip-bg:        #2b2b29;
  --tip-fg:        #f7f7f5;
  --shadow-sm:     0 1px 2px rgba(20, 20, 18, .05);
  --shadow-md:     0 4px 16px -4px rgba(20, 20, 18, .12), 0 1px 3px rgba(20, 20, 18, .06);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI',
               'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  font-feature-settings: 'tnum';
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
svg { display: block; flex: none; }

#app { height: 100vh; display: flex; flex-direction: column; }

/* ─────────── 메뉴바 (Windows 표준 모양) ─────────── */
.menubar {
  flex: none;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 2px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  user-select: none;
}
.menubar[hidden] { display: none; }
.mb-item {
  height: 22px;
  padding: 0 9px;
  border-radius: 4px;
  font-size: 12.5px;
  color: var(--text);
  white-space: nowrap;
}
.mb-item:hover { background: rgba(0, 0, 0, .06); }
.mb-item.open { background: rgba(0, 0, 0, .10); }

.menupop {
  position: fixed;
  z-index: 100;
  min-width: 210px;
  padding: 4px;
  background: #fdfdfc;
  border: 1px solid #d5d5cf;
  border-radius: 7px;
  box-shadow: 0 8px 22px -6px rgba(20, 20, 18, .22), 0 2px 6px rgba(20, 20, 18, .10);
  user-select: none;
}
.menupop[hidden] { display: none; }

.mi {
  display: flex;
  align-items: center;
  width: 100%;
  height: 28px;
  padding: 0 12px 0 28px;
  border-radius: 4px;
  font-size: 12.5px;
  color: var(--text);
  text-align: left;
  position: relative;
}
.mi:hover { background: rgba(0, 0, 0, .07); }
.mi .accel { margin-left: auto; padding-left: 24px; color: var(--text-3); font-size: 12px; }
.mi .tick {
  position: absolute;
  left: 9px;
  display: grid;
  place-items: center;
  color: var(--text);
}
.mi-sep { height: 1px; margin: 4px 8px; background: var(--border); }

/* 항목 우클릭 메뉴 - 체크 표시가 없어 왼쪽 여백을 줄인다 */
.menupop.ctx { min-width: 168px; }
.menupop.ctx .mi { padding-left: 12px; }
.menupop.ctx .mi.danger { color: var(--red); }
.menupop.ctx .mi.danger:hover { background: rgba(184, 86, 77, .12); }

/* ─────────── 헤더 ─────────── */
header { padding: 16px 20px 0; flex: none; }

/* 오늘을 보는 중일 때 화면 전체를 살짝 물들이고, 상단은 한 번 더 진하게 얹는다.
   그라데이션이 아래로 투명해져서 경계선처럼 끊기지 않는다. */
#app.today-view { background: var(--today-bg); }
#app.today-view header { background: linear-gradient(var(--today-wash), transparent); }
#app.today-view footer { background: transparent; }

.hrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.month-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 7px;
  margin-left: -7px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--text-2);
  transition: background .13s, color .13s;
}
.month-btn:hover { background: var(--surface-hover); color: var(--text); }
.month-btn .chev { transition: transform .18s ease; }
.month-btn.open { color: var(--accent); background: var(--accent-soft); }
.month-btn.open .chev { transform: rotate(180deg); }

.day-title {
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-top: 1px;
}
.day-title .dow { font-size: 15px; font-weight: 500; color: var(--text-2); margin-left: 7px; }
.day-title .dow.sun { color: var(--red); }
.day-title .dow.sat { color: var(--blue); }

.actions { display: flex; align-items: center; gap: 6px; }

.chip {
  height: 30px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-2);
  box-shadow: var(--shadow-sm);
  transition: background .13s, color .13s, border-color .13s;
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip:disabled { opacity: .45; cursor: default; box-shadow: none; }
.chip:disabled:hover { color: var(--text-2); border-color: var(--border); }

.icon-btn {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  box-shadow: var(--shadow-sm);
  transition: background .13s, color .13s, border-color .13s;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); }

/* 진행률 */
.progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 14px 0 12px;
  height: 14px;
}
/* 항목이 없을 때도 자리는 남겨야 아래 영역이 위아래로 밀리지 않는다 */
.progress[hidden] { display: flex; visibility: hidden; }
.track {
  flex: 1;
  height: 4px;
  border-radius: 99px;
  background: var(--border);
  overflow: hidden;
}
.fill {
  height: 100%;
  width: 0;
  border-radius: 99px;
  background: var(--accent);
  transition: width .3s cubic-bezier(.4, 0, .2, 1);
}
.ratio { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; }

/* ─────────── 달력 ─────────── */
#calendar {
  flex: none;
  margin: 12px 20px 4px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-md);
  animation: drop .18s cubic-bezier(.16, 1, .3, 1);
}
#calendar[hidden] { display: none; }
@keyframes drop {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: none; }
}

.cal-head {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  margin-bottom: 8px;
  padding: 0 2px;
}
.cal-head b { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
.cal-head #calPrev { justify-self: start; }
.cal-head .cal-right { display: flex; align-items: center; gap: 7px; justify-self: end; }
.cal-head #calClose:hover { background: var(--holiday-hover); color: var(--red); }
.cal-nav {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 7px;
  color: var(--text-2);
  transition: background .13s, color .13s;
}
.cal-nav:hover { background: var(--surface-hover); color: var(--text); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }

.cal-dow {
  height: 22px;
  display: grid;
  place-items: center;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-3);
}
.cal-dow.sun { color: var(--red); }
.cal-dow.sat { color: var(--blue); }

.cal-cell {
  position: relative;
  height: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border-radius: 9px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  border: 1px solid transparent;
  transition: background .12s, color .12s, border-color .12s;
}
.cal-cell.blank { visibility: hidden; }
.cal-cell:not(.blank):hover { background: var(--surface-hover); border-color: var(--border); }
.cal-cell.sat { color: var(--blue); }
.cal-cell.sun { color: var(--red); }
.cal-cell.holiday { color: var(--red); background: var(--holiday); }
.cal-cell.holiday:hover { background: var(--holiday-hover); border-color: transparent; }
.cal-cell.today {
  font-weight: 700;
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
.cal-cell.sel {
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  border-color: var(--accent);
}
.cal-cell.sel:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

/* 공용 툴팁 - 하나를 띄워 옮겨 쓴다.
   가짜 요소로 만들면 스크롤 영역에 잘리고, 네이티브 title 은 OS가 0.5초쯤 늦게 띄운다. */
#tip {
  position: fixed;
  z-index: 200;
  max-width: 300px;
  padding: 5px 9px;
  border-radius: 7px;
  background: var(--tip-bg);
  color: var(--tip-fg);
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: .01em;
  box-shadow: var(--shadow-md);
  pointer-events: none;
}
#tip[hidden] { display: none; }

.cnt {
  min-width: 15px;
  height: 14px;
  padding: 0 4px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 9.5px;
  font-weight: 700;
  line-height: 14px;
  letter-spacing: -.01em;
}
.cnt.all-done { background: var(--border); color: var(--text-3); }
.cal-cell.sel .cnt { background: rgba(255, 255, 255, .25); color: #fff; }

/* ─────────── 검색 ─────────── */
#search-bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 40px;
  margin: 0 20px 10px;
  padding: 0 6px 0 12px;
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 11px;
  box-shadow: 0 0 0 3px var(--accent-ring);
  animation: drop .16s cubic-bezier(.16, 1, .3, 1);
}
#search-bar[hidden] { display: none; }
#search-bar > svg { flex: none; color: var(--accent); }
#search-input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 13.5px;
  color: var(--text);
  background: none;
  border: none;
  outline: none;
}
#search-input::placeholder { color: var(--text-3); }
.sr-count { flex: none; font-size: 11px; font-weight: 700; color: var(--text-3); white-space: nowrap; }
#search-close {
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 7px;
  color: var(--text-3);
  transition: background .12s, color .12s;
}
#search-close:hover { background: var(--surface-hover); color: var(--text); }

#results {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
#results[hidden] { display: none; }
#results::-webkit-scrollbar { width: 10px; }
#results::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}

.sr-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 46px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: border-color .13s, box-shadow .13s;
  animation: pop .16s cubic-bezier(.16, 1, .3, 1);
}
.sr-item:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.sr-item.done .txt { color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.sr-item.done .box { background: var(--accent); border-color: var(--accent); color: #fff; }
.sr-item[data-color].done .box { background: var(--c); border-color: var(--c); }
.sr-date { flex: none; font-size: 11px; font-weight: 600; color: var(--text-3); }
mark {
  background: color-mix(in srgb, var(--accent) 24%, transparent);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
}

/* ─────────── 고정 항목 ─────────── */
#pinned {
  flex: none;
  margin: 0 20px 10px;
  padding: 8px 9px 9px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  border-radius: 12px;
}
#pinned[hidden] { display: none; }

.pin-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  padding: 0 3px;
}
.pin-title {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--accent);
}
.pin-pager { display: flex; align-items: center; gap: 1px; }
.pin-pager[hidden] { display: none; }
.pin-pager button {
  width: 20px; height: 20px;
  display: grid; place-items: center;
  border-radius: 5px;
  color: var(--accent);
  transition: background .12s, opacity .12s;
}
.pin-pager button:hover:not(:disabled) { background: var(--accent-wash); }
.pin-pager button:disabled { opacity: .28; cursor: default; }
.pin-page { font-size: 10.5px; font-weight: 700; color: var(--accent); min-width: 26px; text-align: center; }

.pin-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 34px;
  padding: 4px 3px 4px 7px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .12s;
}
.pin-item + .pin-item { margin-top: 2px; }
.pin-item:hover { background: rgba(255, 255, 255, .62); }
.pin-item .box { width: 17px; height: 17px; border-radius: 6px; border-color: var(--accent-line); }
.pin-item:hover .box { border-color: var(--accent); }
.pin-item.done .box { background: var(--accent); border-color: var(--accent); color: #fff; }
.pin-item .txt { font-size: 13px; font-weight: 450; }
.pin-item.done .txt { color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1px; }

.pin-act { display: flex; gap: 1px; flex: none; }
.pin-act button {
  width: 25px; height: 25px;
  display: grid; place-items: center;
  border-radius: 6px;
  color: var(--text-3);
  transition: background .12s, color .12s;
}
.pin-act button:hover { background: #fff; color: var(--accent); }

/* ─────────── 목록 ─────────── */
#list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
#list[hidden] { display: none; }
#list::-webkit-scrollbar { width: 10px; }
#list::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}
#list::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }

.item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 46px;
  padding: 9px 8px 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: border-color .13s, background .13s, box-shadow .13s;
  animation: pop .16s cubic-bezier(.16, 1, .3, 1);
}
@keyframes pop {
  from { opacity: 0; transform: translateY(-3px); }
  to   { opacity: 1; transform: none; }
}
.item:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.item.done { background: transparent; box-shadow: none; border-color: transparent; }
.item.done:hover { background: var(--surface-hover); border-color: var(--border); box-shadow: none; }

/* 드래그 정렬 */
body.dragging-active { user-select: none; }
body.dragging-active,
body.dragging-active * { cursor: grabbing !important; }

.item.dragging { opacity: .35; }
.item.drop-above::before,
.item.drop-below::after {
  content: '';
  position: absolute;
  left: 2px;
  right: 2px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.item.drop-above::before { top: -5px; }
.item.drop-below::after { bottom: -5px; }

.grip {
  flex: none;
  width: 14px;
  margin-left: -4px;
  margin-right: -5px;
  color: var(--text-3);
  opacity: 0;
  cursor: grab;
  transition: opacity .13s;
}
.item:hover .grip { opacity: .8; }
.grip:active { cursor: grabbing; }

.box {
  width: 20px;
  height: 20px;
  border-radius: 7px;
  border: 1.5px solid var(--border-strong);
  display: grid;
  place-items: center;
  color: transparent;
  transition: background .14s, border-color .14s, color .14s;
}
.item:hover .box { border-color: var(--accent); }
.item.done .box { background: var(--accent); border-color: var(--accent); color: #fff; }

.txt {
  flex: 1;
  min-width: 0;            /* 이게 없으면 flex 항목이 내용 너비 밑으로 줄지 않는다 */
  font-size: 14px;
  font-weight: 450;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color .14s;
}
.item.done .txt { color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1px; }

/* 드랍 - 완료와 구분되게 회색으로 처리한다 */
.item.dropped { background: transparent; box-shadow: none; border-color: transparent; }
.item.dropped:hover { background: var(--surface-hover); border-color: var(--border); box-shadow: none; }
.item.dropped .box,
.pin-item.dropped .box,
.sr-item.dropped .box { background: var(--text-3); border-color: var(--text-3); color: #fff; }
.item.dropped .txt,
.pin-item.dropped .txt,
.sr-item.dropped .txt {
  color: var(--text-3);
  opacity: .72;
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}
.item[data-color].dropped { background: transparent; }
.item[data-color].dropped:hover { background: var(--surface-hover); }

/* 다른 날짜에서 넘어온 항목 */
.carry {
  flex: none;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 2px 6px;
  border-radius: 99px;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  white-space: nowrap;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.carry:hover { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.item.carried { border-style: dashed; box-shadow: none; }
.item.carried:hover { box-shadow: var(--shadow-sm); }

.pin-mark { flex: none; display: grid; place-items: center; color: var(--accent); }

/* 항목 색상 */
.bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: var(--c);
}
.item .bar { border-radius: 11px 0 0 11px; }
.pin-item .bar { width: 3px; border-radius: 8px 0 0 8px; }
.item[data-color] { background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.item[data-color]:hover { background: color-mix(in srgb, var(--c) 17%, var(--surface)); }
.item[data-color].done { background: transparent; }
.item[data-color].done:hover { background: color-mix(in srgb, var(--c) 11%, var(--surface)); }
.item[data-color]:hover .box { border-color: var(--c); }
.item[data-color].done .box,
.pin-item[data-color].done .box { background: var(--c); border-color: var(--c); }
.pin-item[data-color]:hover .box { border-color: var(--c); }

.colorpop {
  position: fixed;
  z-index: 110;
  padding: 9px;
  background: #fdfdfc;
  border: 1px solid #d5d5cf;
  border-radius: 11px;
  box-shadow: var(--shadow-md);
  display: grid;
  grid-template-columns: repeat(3, 26px);
  gap: 7px;
}
.colorpop[hidden] { display: none; }
.sw {
  position: relative;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--c);
  transition: transform .1s;
}
.sw:hover { transform: scale(1.13); }
.sw.on { box-shadow: 0 0 0 2px #fdfdfc, 0 0 0 3.5px var(--text-2); }
.sw.none { background: var(--surface); border: 1.5px solid var(--border-strong); }
.sw.none::after {
  content: '';
  position: absolute;
  left: 50%; top: 3px; bottom: 3px;
  width: 1.5px;
  background: var(--red);
  transform: translateX(-50%) rotate(45deg);
}

.edit {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 14px;
  color: var(--text);
  background: transparent;
  border: none;
  outline: none;
  padding: 0;
}

.empty {
  margin: auto;
  padding-bottom: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--text-3);
  text-align: center;
}
.empty .t { font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.empty .s { font-size: 12px; }

/* ─────────── 입력 ─────────── */
footer {
  flex: none;
  padding: 12px 20px 16px;
  background: var(--bg);
  border-top: 1px solid var(--border);
}

.field {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 44px;
  padding: 0 6px 0 15px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  transition: border-color .14s, box-shadow .14s;
}
.field:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-ring);
}

#input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 14px;
  color: var(--text);
  background: none;
  border: none;
  outline: none;
}
#input::placeholder { color: var(--text-3); }

.submit {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  transition: background .14s, opacity .14s, transform .14s;
}
.submit:hover:not(:disabled) { background: var(--accent-hover); }
.submit:active:not(:disabled) { transform: scale(.94); }
.submit:disabled { opacity: .3; cursor: default; }
</style>
</head>

  pin:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.8a2 2 0 0 0-1.1-1.7l-1.8-.9a2 2 0 0 1-1.1-1.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>',
  pinOn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 17v5" stroke-linecap="round"/><path d="M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.8a2 2 0 0 0-1.1-1.7l-1.8-.9a2 2 0 0 1-1.1-1.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>',
  jump:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>',
  cross: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  carry: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  ring:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8"/></svg>',
  dot:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
};

/* 항목 상태: 0 미확인 · 1 완료 · 2 드랍
   미확인 항목은 등록일 다음 평일부터 매 평일에 계속 나타난다.
   앞으로는 오늘 기준 평일 3일까지만 미리 보여준다.
   load()가 이 값을 쓰므로 data 초기화보다 먼저 선언해야 한다. */
const OPEN = 0, DONE = 1, DROPPED = 2;
const LOOKAHEAD_BIZ_DAYS = 3;
const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;

let data = load();
let today = key(new Date());
let cur = today;
let calMonth = firstOfMonth(cur);
let drag = null;
let dropTo = null;
let scrollDir = 0;
let lastY = 0;
let justDragged = false;
let pinPage = 0;
let pinPages = 1;
let searchOpen = false;
let menuState = { alwaysOnTop: false, minimizeToTray: true, deleteLock: false };

const COLORS = {
  red: '#b91c1c', orange: '#c2410c', amber: '#a16207', green: '#15803d',
  teal: '#006b8a', blue: '#1d4ed8', purple: '#7e22ce', gray: '#57574e',
};
const colorOf = it => (it.color && COLORS[it.color]) ? COLORS[it.color] : null;

const stateClass = s => s === DONE ? ' done' : s === DROPPED ? ' dropped' : '';
const stateIcon = s => s === DROPPED ? ICON.cross : ICON.check;
const srcLabel = k => { const d = parse(k); return L().md(d.getMonth() + 1, d.getDate()); };

// 미확인 -> 완료 -> 드랍 -> 미확인
// 어느 날짜에서 처리했는지 남겨야 그날 목록에서 사라지지 않는다
function cycle(it) {
  it.state = (it.state + 1) % 3;
  if (it.state === OPEN) delete it.settledOn;
  else it.settledOn = cur;
  save();
  render();
}

function paintColor(row, it) {
  const hex = colorOf(it);
  if (!hex) return;
  row.dataset.color = it.color;
  row.style.setProperty('--c', hex);
  const bar = document.createElement('span');
  bar.className = 'bar';
  row.prepend(bar);
}

function load() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; }
  // 예전 자료는 done 불리언을 쓴다 - 상태 값으로 옮긴다
  for (const date of Object.keys(raw)) {
    raw[date].forEach(it => {
      if (it.state === undefined) it.state = it.done ? DONE : OPEN;
      delete it.done;
    });
  }
  return raw;
}

// 주말을 건너뛰며 평일 n일 뒤 날짜
function addBizDays(k, n) {
  const d = parse(k);
  for (let added = 0; added < n; ) {
    d.setDate(d.getDate() + 1);
    if (!isWeekend(d)) added++;
  }
  return key(d);
}

// 해당 날짜에 보여줄 항목 - 그날 등록한 것 + 아직 확인하지 않아 넘어온 것.
// 미확인 항목은 등록일 다음 평일부터 매 평일에 나타나고, 확인하면 그 자리에서 멈춘다.
function itemsFor(k) {
  const own = (data[k] || []).map(it => ({ it, from: k, carried: false }));
  if (isWeekend(parse(k))) return own;
  // 먼 미래까지 미확인 항목이 줄줄이 보이지 않도록 앞쪽은 평일 3일까지만
  if (k > addBizDays(today, LOOKAHEAD_BIZ_DAYS)) return own;

  const carried = [];
  for (const date of Object.keys(data)) {
    if (date >= k) continue;
    data[date].forEach(it => {
      // 미확인이면 계속 따라오고, 처리한 항목은 처리한 날짜까지만 남는다
      const live = it.state === OPEN ? true : (it.settledOn && k <= it.settledOn);
      if (live) carried.push({ it, from: date, carried: true });
    });
  }
  carried.sort((a, b) => a.from.localeCompare(b.from));
  return own.concat(carried);
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(data)); } catch {}
}
function key(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function parse(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function shiftDay(k, n) {
  const d = parse(k);
  d.setDate(d.getDate() + n);
  return key(d);
}
function firstOfMonth(k) {
  const d = parse(k);
  return new Date(d.getFullYear(), d.getMonth(), 1);
}

/* ─── 렌더링 ─── */
// HTML에 박아둔 문구는 언어가 바뀔 때마다 다시 채운다.
function applyStaticText() {
  const set = (id, attr, val) => document.getElementById(id).setAttribute(attr, val);
  const tip = (id, val) => { document.getElementById(id).dataset.tip = val; };
  const bar = document.getElementById('menu-bar');
  bar.querySelector('[data-menu="file"]').textContent = L().menuFile;
  bar.querySelector('[data-menu="settings"]').textContent = L().menuSettings;
  bar.querySelector('[data-menu="help"]').textContent = L().menuHelp;

  tip('monthBtn', L().openCalendar);
  tip('searchBtn', L().searchTip);
  tip('prev', L().prevDay);
  tip('next', L().nextDay);
  tip('calPrev', L().prevMonth);
  tip('calNext', L().nextMonth);
  tip('calClose', L().closeCalendar);
  tip('pinPrev', L().prev);
  tip('pinNext', L().next);
  tip('search-close', L().close);
  tip('add', L().addTip);
  set('search-input', 'placeholder', L().searchPlaceholder);
  set('input', 'placeholder', L().addPlaceholder);
  todayBtn.textContent = L().today;
}

function render() {
  applyStaticText();
  list.hidden = searchOpen;
  results.hidden = !searchOpen;
  renderHeader();
  renderPinned();
  if (searchOpen) renderSearch();
  else renderList();
  if (!calendar.hidden) renderCal();
}

/* ─── 검색 ─── */
const searchBar = document.getElementById('search-bar');
const searchInput = document.getElementById('search-input');
const searchCount = document.getElementById('search-count');

function openSearch() {
  searchOpen = true;
  searchBar.hidden = false;
  if (!calendar.hidden) toggleCal();
  render();
  searchInput.focus();
  searchInput.select();
}

function closeSearch() {
  searchOpen = false;
  searchBar.hidden = true;
  searchInput.value = '';
  render();
  input.focus();
}

function searchAll(q) {
  const out = [];
  for (const date of Object.keys(data)) {
    data[date].forEach(it => {
      if (it.text.toLowerCase().includes(q)) out.push({ date, it });
    });
  }
  return out.sort((a, b) => b.date.localeCompare(a.date));
}

// innerHTML 대신 노드로 조립한다 - 검색어가 그대로 마크업이 되면 안 된다
function highlight(text, q) {
  const frag = document.createDocumentFragment();
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) { frag.append(text); return frag; }
  const m = document.createElement('mark');
  m.textContent = text.slice(i, i + q.length);
  frag.append(text.slice(0, i), m, text.slice(i + q.length));
  return frag;
}

function renderSearch() {
  const q = searchInput.value.trim().toLowerCase();
  results.innerHTML = '';

  if (!q) {
    searchCount.textContent = '';
    results.innerHTML = `
      <div class="empty">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
        <div>
          <div class="t">${L().searchTitle}</div>
          <div class="s">${L().searchSub}</div>
        </div>
      </div>`;
    return;
  }

  const hits = searchAll(q);
  searchCount.textContent = L().hits(hits.length);

  if (!hits.length) {
    results.innerHTML = `
      <div class="empty">
        <div>
          <div class="t">${L().noHitTitle}</div>
          <div class="s">${L().noHitSub}</div>
        </div>
      </div>`;
    return;
  }

  hits.forEach(({ date, it }) => {
    const d = parse(date);
    const row = document.createElement('div');
    row.className = 'sr-item' + stateClass(it.state);
    row.innerHTML = `
      <span class="box">${stateIcon(it.state)}</span>
      <span class="txt"></span>
      <span class="sr-date">${L().md(d.getMonth() + 1, d.getDate())}</span>`;
    row.querySelector('.txt').append(highlight(it.text, q));
    paintColor(row, it);
    row.dataset.tip = `${dateLabel(date)} · ${L().clickToOpen}`;

    row.querySelector('.box').onclick = e => {
      e.stopPropagation();
      cycle(it);
    };
    row.onclick = () => { closeSearch(); goto(date); };
    results.appendChild(row);
  });
}

const PIN_PER_PAGE = 3;
const dateLabel = k => {
  const d = parse(k);
  return L().full(d.getFullYear(), d.getMonth() + 1, d.getDate(), L().dowLong[d.getDay()]);
};

function allPinned() {
  const out = [];
  for (const date of Object.keys(data)) {
    data[date].forEach(it => { if (it.pinnedAt) out.push({ date, it }); });
  }
  return out.sort((a, b) => b.it.pinnedAt - a.it.pinnedAt);
}

function renderPinned() {
  const pins = allPinned();
  pinned.hidden = !pins.length;
  if (!pins.length) { pinPage = 0; pinPages = 1; return; }

  if (searchOpen) { pinned.hidden = true; return; }

  const pages = pinPages = Math.ceil(pins.length / PIN_PER_PAGE);
  pinPage = Math.max(0, Math.min(pinPage, pages - 1));
  pinTitle.textContent = L().pinned(pins.length);
  pinPager.hidden = pages < 2;
  pinPageLabel.textContent = `${pinPage + 1}/${pages}`;
  pinPrev.disabled = pinPage === 0;
  pinNext.disabled = pinPage === pages - 1;

  pinList.innerHTML = '';
  pins.slice(pinPage * PIN_PER_PAGE, (pinPage + 1) * PIN_PER_PAGE).forEach(({ date, it }) => {
    const row = document.createElement('div');
    row.className = 'pin-item' + stateClass(it.state);
    row.dataset.tip = L().addedOn(dateLabel(date));
    row.innerHTML = `
      <span class="box">${stateIcon(it.state)}</span>
      <span class="txt"></span>
      <span class="pin-act">
        <button class="go">${ICON.jump}</button>
        <button class="off">${ICON.pinOn}</button>
      </span>`;
    row.querySelector('.txt').textContent = it.text;
    paintColor(row, it);

    const go = row.querySelector('.go');
    go.dataset.tip = L().goTo(dateLabel(date));
    go.onclick = e => { e.stopPropagation(); goto(date); };

    const off = row.querySelector('.off');
    off.dataset.tip = L().unpin;
    off.onclick = e => {
      e.stopPropagation();
      delete it.pinnedAt;
      save(); render();
    };

    row.onclick = () => cycle(it);
    pinList.appendChild(row);
  });
}

function renderHeader() {
  const d = parse(cur);
  const w = d.getDay();
  ymLabel.textContent = L().ym(d.getFullYear(), d.getMonth() + 1);
  dayTitle.innerHTML =
    `${L().dayNum(d.getDate())}<span class="dow ${w === 0 ? 'sun' : w === 6 ? 'sat' : ''}">${L().dowLong[w]}</span>`;

  todayBtn.disabled = cur === today;
  document.getElementById('app').classList.toggle('today-view', cur === today);

  const arr = itemsFor(cur);
  const settled = arr.filter(e => e.it.state !== OPEN).length;
  progress.hidden = !arr.length;
  if (arr.length) {
    progFill.style.width = `${(settled / arr.length) * 100}%`;
    progText.textContent = `${settled}/${arr.length}`;
  }
}

function renderList() {
  const arr = itemsFor(cur);
  list.innerHTML = '';

  if (!arr.length) {
    list.innerHTML = `
      <div class="empty">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3.5 10h17"/>
        </svg>
        <div>
          <div class="t">${L().emptyTitle}</div>
          <div class="s">${L().emptySub}</div>
        </div>
      </div>`;
    return;
  }

  arr.forEach(({ it, from, carried }, i) => {
    const row = document.createElement('div');
    const hex = colorOf(it);
    row.className = 'item' + stateClass(it.state)
      + (it.pinnedAt ? ' pinned' : '') + (carried ? ' carried' : '');
    row.innerHTML = `
      ${carried ? '' : `<span class="grip" data-tip="${L().dragTip}">${ICON.grip}</span>`}
      <span class="box">${stateIcon(it.state)}</span>
      <span class="txt"></span>
      ${carried ? `<button class="carry">${ICON.carry}${srcLabel(from)}</button>` : ''}
      ${it.pinnedAt ? `<span class="pin-mark" data-tip="${L().unpin}">${ICON.pinOn}</span>` : ''}`;
    row.querySelector('.txt').textContent = it.text;
    paintColor(row, it);
    if (carried) {
      const chip = row.querySelector('.carry');
      chip.dataset.tip = L().carriedFrom(dateLabel(from));
      // 행으로 전달되면 완료 처리가 돼 항목이 사라진다
      chip.onclick = e => { e.stopPropagation(); goto(from); };
    }

    row.onclick = () => {
      if (justDragged) return;
      cycle(it);
    };

    row.oncontextmenu = e => {
      e.preventDefault();
      const entries = [
        { label: L().edit, run: () => startEdit(row, it) },
        {
          label: it.pinnedAt ? L().unpin : L().pin,
          run: () => {
            if (it.pinnedAt) delete it.pinnedAt;
            else it.pinnedAt = Date.now();
            save(); render();
          },
        },
        {
          label: hex ? L().colorIs(L().colors[it.color]) : L().setColor,
          run: () => openColorPop({ left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY }, it),
        },
      ];
      if (!menuState.deleteLock) {
        entries.push({ sep: true }, {
          label: L().del,
          danger: true,
          run: () => {
            data[from] = data[from].filter(x => x !== it);
            if (!data[from].length) delete data[from];
            save(); render();
          },
        });
      }
      openCtxMenu(e.clientX, e.clientY, entries);
    };

    // 넘어온 항목은 원래 날짜의 순서를 따르므로 여기서 끌어 옮기지 않는다
    if (!carried) row.onpointerdown = e => {
      if (e.button !== 0) return;
      if (e.target.closest('button, input')) return;
      if (row.querySelector('.edit')) return;
      drag = { idx: i, row, startY: e.clientY, moved: false };
    };

    list.appendChild(row);
  });

  // 말줄임된 항목만 전체 내용을 툴팁으로 보여준다
  list.querySelectorAll('.txt').forEach(el => {
    if (el.scrollWidth > el.clientWidth + 1) el.dataset.tip = el.textContent;
  });
}

/* ─── 드래그 정렬 ───
   HTML5 드래그는 커서를 OS가 정해서 no-drop/move가 번갈아 뜬다.
   포인터 이벤트로 직접 처리해 커서를 grabbing 하나로 고정한다. */
function updateDropTarget(y) {
  clearDropMarks();
  dropTo = null;
  // 넘어온 항목은 순서 대상이 아니라 제외한다 - 남은 행의 위치가 data[cur] 순서와 같다
  const rows = [...list.querySelectorAll('.item:not(.carried)')];
  if (!rows.length) return;

  const inPlace = to => to === drag.idx || to === drag.idx + 1;

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (y < r.top || y > r.bottom) continue;
    const below = y - r.top > r.height / 2;
    const to = i + (below ? 1 : 0);
    if (inPlace(to)) return;
    dropTo = to;
    rows[i].classList.add(below ? 'drop-below' : 'drop-above');
    return;
  }

  // 목록 위/아래 빈 공간으로 끌어 놓는 경우
  if (y < rows[0].getBoundingClientRect().top) {
    if (!inPlace(0)) { dropTo = 0; rows[0].classList.add('drop-above'); }
  } else if (y > rows[rows.length - 1].getBoundingClientRect().bottom) {
    if (!inPlace(rows.length)) { dropTo = rows.length; rows[rows.length - 1].classList.add('drop-below'); }
  }
}

function tickAutoScroll() {
  if (!drag) return;
  if (drag.moved && scrollDir) {
    list.scrollTop += scrollDir * 7;
    updateDropTarget(lastY);
  }
  requestAnimationFrame(tickAutoScroll);
}

addEventListener('pointermove', e => {
  if (!drag) return;
  lastY = e.clientY;

  if (!drag.moved) {
    if (Math.abs(e.clientY - drag.startY) < 4) return;
    drag.moved = true;
    drag.row.classList.add('dragging');
    document.body.classList.add('dragging-active');
    requestAnimationFrame(tickAutoScroll);
  }

  const r = list.getBoundingClientRect();
  scrollDir = e.clientY < r.top + 26 ? -1 : e.clientY > r.bottom - 26 ? 1 : 0;
  updateDropTarget(e.clientY);
});

addEventListener('pointerup', () => {
  if (!drag) return;
  const { idx, row, moved } = drag;
  drag = null;
  scrollDir = 0;
  document.body.classList.remove('dragging-active');
  if (!moved) return;

  justDragged = true;
  setTimeout(() => { justDragged = false; }, 80);

  if (dropTo === null) {
    row.classList.remove('dragging');
    clearDropMarks();
  } else {
    moveItem(idx, dropTo);
  }
  dropTo = null;
});

function clearDropMarks() {
  list.querySelectorAll('.drop-above, .drop-below')
      .forEach(el => el.classList.remove('drop-above', 'drop-below'));
}

function moveItem(from, to) {
  const arr = data[cur];
  if (!arr || from === to || from + 1 === to) { clearDropMarks(); return; }
  const [moved] = arr.splice(from, 1);
  arr.splice(to > from ? to - 1 : to, 0, moved);
  save();
  render();
}

/* ─── 툴팁 ─── */
const tipEl = document.getElementById('tip');
let tipFor = null;

function showTip(el) {
  tipEl.textContent = el.dataset.tip;
  tipEl.hidden = false;
  const r = el.getBoundingClientRect();
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const left = Math.max(6, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 6));
  const above = r.top - h - 6;
  tipEl.style.left = `${left}px`;
  tipEl.style.top = `${above < 6 ? r.bottom + 6 : above}px`;
}

function hideTip() { tipEl.hidden = true; tipFor = null; }

addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el === tipFor) return;
  tipFor = el;
  el ? showTip(el) : hideTip();
});
addEventListener('mousedown', hideTip);
addEventListener('wheel', hideTip, { passive: true });
addEventListener('blur', hideTip);

/* ─── 항목 우클릭 메뉴 ─── */
const ctxPop = document.getElementById('ctx-pop');

function openCtxMenu(x, y, entries) {
  closeColorPop();
  ctxPop.innerHTML = '';
  entries.forEach(spec => {
    if (spec.sep) {
      const s = document.createElement('div');
      s.className = 'mi-sep';
      ctxPop.appendChild(s);
      return;
    }
    const mi = document.createElement('button');
    mi.className = 'mi' + (spec.danger ? ' danger' : '');
    mi.textContent = spec.label;
    mi.onclick = ev => {
      ev.stopPropagation();
      closeCtxMenu();
      spec.run();
    };
    ctxPop.appendChild(mi);
  });

  ctxPop.hidden = false;
  const w = ctxPop.offsetWidth, h = ctxPop.offsetHeight;
  ctxPop.style.left = `${Math.max(6, Math.min(x, innerWidth - w - 6))}px`;
  ctxPop.style.top = `${y + h > innerHeight ? Math.max(6, y - h) : y}px`;
}

function closeCtxMenu() { ctxPop.hidden = true; }

/* ─── 색상 선택 ─── */
const colorPop = document.getElementById('color-pop');

function openColorPop(anchor, it) {
  colorPop.innerHTML = '';
  const add = (key, hex, name) => {
    const b = document.createElement('button');
    b.className = 'sw' + (key ? '' : ' none') + ((it.color || '') === key ? ' on' : '');
    if (hex) b.style.setProperty('--c', hex);
    b.dataset.tip = name;
    b.onclick = e => {
      e.stopPropagation();
      if (key) it.color = key; else delete it.color;
      save();
      closeColorPop();
      render();
    };
    colorPop.appendChild(b);
  };
  add('', '', L().noColor);
  Object.entries(COLORS).forEach(([k, hex]) => add(k, hex, L().colors[k]));

  colorPop.hidden = false;
  const r = typeof anchor.getBoundingClientRect === 'function'
    ? anchor.getBoundingClientRect() : anchor;
  const w = colorPop.offsetWidth, h = colorPop.offsetHeight;
  colorPop.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
  colorPop.style.top = `${r.bottom + 6 + h > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6}px`;
}

function closeColorPop() { colorPop.hidden = true; }

function startEdit(row, it) {
  const txt = row.querySelector('.txt');
  const inp = document.createElement('input');
  inp.className = 'edit';
  inp.value = it.text;
  row.replaceChild(inp, txt);
  row.onclick = null;
  inp.focus();
  inp.select();

  let closed = false;
  const commit = () => {
    if (closed) return;
    closed = true;
    const v = inp.value.trim();
    if (v) it.text = v;
    save(); render();
  };
  inp.onclick = e => e.stopPropagation();
  inp.onblur = commit;
  inp.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') { closed = true; render(); }
  };
}

function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  calLabel.textContent = L().ym(y, m + 1);
  calGrid.innerHTML = '';

  L().dow.forEach((w, i) => {
    const h = document.createElement('div');
    h.className = 'cal-dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
    h.textContent = w;
    calGrid.appendChild(h);
  });

  const start = new Date(y, m, 1).getDay();
  const last = new Date(y, m + 1, 0).getDate();

  for (let i = 0; i < start; i++) {
    const c = document.createElement('div');
    c.className = 'cal-cell blank';
    calGrid.appendChild(c);
  }

  for (let d = 1; d <= last; d++) {
    const k = key(new Date(y, m, d));
    const arr = itemsFor(k).map(e => e.it);
    const col = (start + d - 1) % 7;
    const holiday = HOLIDAYS[k];

    const cell = document.createElement('button');
    cell.className = 'cal-cell'
      + (col === 0 ? ' sun' : col === 6 ? ' sat' : '')
      + (holiday ? ' holiday' : '')
      + (k === today ? ' today' : '')
      + (k === cur ? ' sel' : '')
      + (col <= 1 ? '' : col >= 5 ? '' : '');
    cell.innerHTML = `<span>${d}</span>`;

    if (arr.length) {
      const b = document.createElement('span');
      b.className = 'cnt' + (arr.every(x => x.state !== OPEN) ? ' all-done' : '');
      b.textContent = arr.length;
      cell.appendChild(b);
    }

    const tip = [
      holiday ? holidayName(holiday) : null,
      arr.length ? L().countTip(arr.length, arr.filter(x => x.state !== OPEN).length) : null,
    ].filter(Boolean).join('  ·  ');
    if (tip) cell.dataset.tip = tip;

    cell.onclick = () => { cur = k; render(); };
    calGrid.appendChild(cell);
  }
}

/* ─── 동작 ─── */
function addItem() {
  const v = input.value.trim();
  if (!v) return;
  (data[cur] ||= []).push({ text: v, state: OPEN });
  input.value = '';
  add.disabled = true;
  save();
  render();
  list.scrollTop = list.scrollHeight;
}

function goto(k) {
  cur = k;
  calMonth = firstOfMonth(cur);
  render();
}

function toggleCal() {
  calendar.hidden = !calendar.hidden;
  monthBtn.classList.toggle('open', !calendar.hidden);
  if (!calendar.hidden) { calMonth = firstOfMonth(cur); renderCal(); }
}

monthBtn.onclick = toggleCal;
prev.onclick = () => goto(shiftDay(cur, -1));
next.onclick = () => goto(shiftDay(cur, 1));
todayBtn.onclick = () => { checkDateRollover(); goto(today); };
calPrev.onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCal(); };
calNext.onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCal(); };
calClose.onclick = toggleCal;
pinPrev.onclick = () => { pinPage--; renderPinned(); };
pinNext.onclick = () => { pinPage++; renderPinned(); };

// 고정 패널 위에서 휠을 굴리면 페이지를 넘긴다.
// 한 번의 스와이프로 여러 장이 넘어가지 않도록 짧은 쿨다운을 둔다.
let pinWheelAt = 0;
pinned.addEventListener('wheel', e => {
  if (pinPages < 2) return;
  e.preventDefault();
  const now = performance.now();
  if (now - pinWheelAt < 220) return;
  const next = Math.max(0, Math.min(pinPages - 1, pinPage + (e.deltaY > 0 ? 1 : -1)));
  if (next === pinPage) return;
  pinWheelAt = now;
  pinPage = next;
  renderPinned();
}, { passive: false });

add.onclick = addItem;
input.oninput = () => { add.disabled = !input.value.trim(); };
input.onkeydown = e => { if (e.key === 'Enter') addItem(); };

/* ─── 날짜 넘어가기 ───
   창을 켜둔 채 자정을 넘기면 '오늘'이 어제가 된다. 다시 그리지 않으면
   오늘 버튼이 잠긴 채로 남고 달력의 오늘 표시도 어제에 머문다. */
function checkDateRollover() {
  const now = key(new Date());
  if (now === today) return;
  const wasViewingToday = cur === today;
  today = now;
  if (wasViewingToday) {
    cur = now;
    calMonth = firstOfMonth(cur);
  }
  render();
}

function scheduleMidnight() {
  const now = new Date();
  // 자정 2초 뒤로 잡아 시계 오차로 하루 전에 깨는 일을 막는다
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 2);
  setTimeout(() => { checkDateRollover(); scheduleMidnight(); }, next - now);
}
scheduleMidnight();

// 절전에서 깨어나면 위 타이머가 늦게 울릴 수 있어 주기 점검을 같이 둔다
setInterval(checkDateRollover, 30000);
document.addEventListener('visibilitychange', checkDateRollover);

const isTextField = el => el && /^(INPUT|TEXTAREA)$/.test(el.tagName);

// 창이 활성화돼 있으면 어디를 클릭했든 타이핑은 입력칸으로 간다.
// 한글 IME는 조합 시작 전에 포커스가 잡혀 있어야 첫 글자를 잃지 않는다.
function focusInput() {
  if (isTextField(document.activeElement)) return;
  if (menuOpen) return;
  (searchOpen ? searchInput : input).focus();
}

addEventListener('focus', () => { checkDateRollover(); focusInput(); });
addEventListener('mouseup', () => setTimeout(focusInput, 0));
addEventListener('keydown', e => {
  if (e.ctrlKey && !e.altKey && !e.metaKey && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    searchOpen ? searchInput.select() : openSearch();
    return;
  }
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (isTextField(document.activeElement)) return;
  if (e.key.length === 1 || e.key === 'Process' || e.key === 'Backspace') focusInput();
}, true);

searchBtn.onclick = () => { searchOpen ? closeSearch() : openSearch(); };
document.getElementById('search-close').onclick = closeSearch;
searchInput.oninput = renderSearch;

document.onkeydown = e => {
  if (e.key === 'Escape') {
    if (!colorPop.hidden) closeColorPop();
    else if (!ctxPop.hidden) closeCtxMenu();
    else if (menuOpen) closeMenu();
    else if (searchOpen) closeSearch();
    else if (!calendar.hidden) toggleCal();
    return;
  }
  if (searchOpen) return;
  const el = document.activeElement;
  if (el && el.classList.contains('edit')) return;
  // 입력칸이 비어 있을 때만 좌우 방향키로 날짜를 옮긴다 (글자가 있으면 커서 이동).
  if (isTextField(el) && el.value !== '') return;
  if (e.key === 'ArrowLeft') goto(shiftDay(cur, -1));
  if (e.key === 'ArrowRight') goto(shiftDay(cur, 1));
};

input.focus();

render();

/* ─── 메뉴바 ─── */
// 메뉴 이름은 언어에 따라 바뀌지만, Language 메뉴만은 항상 영어로 둔다.
const menus = () => ({
  file: [
    { label: L().exit, accel: 'Ctrl+Q', action: 'quit' },
  ],
  settings: [
    { label: L().alwaysOnTop, accel: 'Ctrl+T', action: 'toggleAlwaysOnTop', check: 'alwaysOnTop' },
    { label: L().minToTray, action: 'toggleMinimizeToTray', check: 'minimizeToTray' },
    { sep: true },
    { label: L().deleteLock, action: 'toggleDeleteLock', check: 'deleteLock' },
  ],
  language: [
    { label: '한국어', action: 'langKo', checkIf: () => lang === 'ko' },
    { label: 'English', action: 'langEn', checkIf: () => lang === 'en' },
  ],
  help: [
    { label: L().about, action: 'about' },
  ],
});
const TICK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';

// id 기반 암묵 전역 대신 명시적으로 잡는다 - window.menubar는 브라우저 내장 BarProp이다.
const menuBar = document.getElementById('menu-bar');
const menuPop = document.getElementById('menu-pop');

let menuOpen = null;

function openMenu(name) {
  const btn = menuBar.querySelector(`[data-menu="${name}"]`);
  menuOpen = name;
  menuBar.querySelectorAll('.mb-item').forEach(b => b.classList.toggle('open', b === btn));

  menuPop.innerHTML = '';
  menus()[name].forEach(spec => {
    if (spec.sep) {
      const s = document.createElement('div');
      s.className = 'mi-sep';
      menuPop.appendChild(s);
      return;
    }
    const mi = document.createElement('button');
    mi.className = 'mi';
    const ticked = spec.checkIf ? spec.checkIf() : (spec.check && menuState[spec.check]);
    mi.innerHTML =
      (ticked ? `<span class="tick">${TICK}</span>` : '') +
      `<span></span>` +
      (spec.accel ? `<span class="accel">${spec.accel}</span>` : '');
    mi.querySelector('span:not(.tick):not(.accel)').textContent = spec.label;
    mi.onclick = async () => {
      closeMenu();
      if (!window.appMenu) return;
      menuState = await appMenu.run(spec.action);
      lang = menuState.lang;
      render();
    };
    menuPop.appendChild(mi);
  });

  const r = btn.getBoundingClientRect();
  menuPop.hidden = false;
  menuPop.style.left = `${Math.min(r.left, innerWidth - menuPop.offsetWidth - 6)}px`;
  menuPop.style.top = `${r.bottom + 3}px`;
}

function closeMenu() {
  menuOpen = null;
  menuPop.hidden = true;
  menuBar.querySelectorAll('.mb-item').forEach(b => b.classList.remove('open'));
}

menuBar.querySelectorAll('.mb-item').forEach(btn => {
  btn.onclick = e => {
    e.stopPropagation();
    const name = btn.dataset.menu;
    menuOpen === name ? closeMenu() : openMenu(name);
  };
  btn.onmouseenter = () => { if (menuOpen && menuOpen !== btn.dataset.menu) openMenu(btn.dataset.menu); };
});

addEventListener('mousedown', e => {
  if (menuOpen && !menuPop.contains(e.target) && !menuBar.contains(e.target)) closeMenu();
  if (!colorPop.hidden && !colorPop.contains(e.target)) closeColorPop();
  if (!ctxPop.hidden && !ctxPop.contains(e.target)) closeCtxMenu();
});
addEventListener('blur', () => { closeMenu(); closeColorPop(); closeCtxMenu(); });

if (window.appMenu) {
  menuBar.hidden = false;
  appMenu.state().then(s => { menuState = s; lang = s.lang; render(); });
  appMenu.onState(s => {
    menuState = s;
    lang = s.lang;
    render();
    if (menuOpen) openMenu(menuOpen);
  });
}
</script>
</body>
</html>
