<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>
<style>
@font-face {
  font-family: 'Pretendard Variable';
  src: url('assets/Pretendard-Variable.woff2') format('woff2-variations');
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}

/* 색과 모양은 메인 창(index.html)과 같은 값을 쓴다 */
:root {
  --bg:            #f5f5f3;
  --surface:       #ffffff;
  --surface-hover: #fafaf9;
  --border:        #e7e7e2;
  --border-strong: #d6d6cf;
  --text:          #1c1c1a;
  --text-2:        #71716b;
  --text-3:        #a3a39c;
  --accent:        #0e7490;
  --accent-hover:  #155e75;
  --accent-soft:   #e6f4f8;
  --accent-line:   #cbe2ea;
  --accent-wash:   rgba(14, 116, 144, .12);
  --accent-ring:   rgba(14, 116, 144, .18);
  --red:           #b8564d;
  --tip-bg:        #2b2b29;
  --tip-fg:        #f7f7f5;
  --shadow-sm:     0 1px 2px rgba(20, 20, 18, .05);
  --shadow-md:     0 4px 16px -4px rgba(20, 20, 18, .12), 0 1px 3px rgba(20, 20, 18, .06);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI',
               'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  font-feature-settings: 'tnum';
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
svg { display: block; flex: none; }

#app { height: 100vh; display: flex; flex-direction: column; }

/* ─────────── 헤더 ─────────── */
header { flex: none; padding: 16px 20px 12px; }

.hrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
h1 {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.02em;
  white-space: nowrap;
}
h1 .total { font-size: 13px; font-weight: 600; color: var(--text-3); letter-spacing: 0; }

.chip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding: 0 11px 0 9px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-2);
  box-shadow: var(--shadow-sm);
  transition: background .13s, color .13s, border-color .13s;
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }

.search {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 38px;
  margin-top: 12px;
  padding: 0 6px 0 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  transition: border-color .14s, box-shadow .14s;
}
.search > svg { color: var(--text-3); transition: color .14s; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.search:focus-within > svg { color: var(--accent); }
#q {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 13.5px;
  color: var(--text);
  background: none;
  border: none;
  outline: none;
}
#q::placeholder { color: var(--text-3); }
.q-count { flex: none; font-size: 11px; font-weight: 700; color: var(--text-3); white-space: nowrap; }
#qClear {
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 7px;
  color: var(--text-3);
  transition: background .12s, color .12s;
}
#qClear:hover { background: var(--surface-hover); color: var(--text); }
#qClear[hidden] { display: none; }

/* ─────────── 목록 ─────────── */
#list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 20px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
#list::-webkit-scrollbar { width: 10px; }
#list::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}
#list::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }

/* 그룹 사이를 margin 대신 padding 으로 띄운다 - 끌어 옮길 때 그룹 사이 틈에서도 놓을 자리를 잃지 않는다 */
.grp { padding-bottom: 14px; }
.grp-head {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  margin: 0 -6px 4px;
  padding: 0 4px 0 6px;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  transition: background .12s, box-shadow .12s;
}
.grp-head:hover { background: rgba(0, 0, 0, .035); }
.fold {
  width: 16px;
  display: grid;
  place-items: center;
  color: var(--text-3);
  transition: transform .16s ease;
}
.grp.collapsed .fold { transform: rotate(-90deg); }
.grp-name {
  min-width: 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .03em;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.grp.inbox .grp-name { font-weight: 600; color: var(--text-3); }
.grp.target .grp-name { color: var(--accent); }
.cnt {
  flex: none;
  min-width: 18px;
  height: 16px;
  padding: 0 5px;
  border-radius: 99px;
  background: var(--border);
  color: var(--text-2);
  font-size: 10px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
}
.grp.target .cnt { background: var(--accent-soft); color: var(--accent); }
.grp-act { display: flex; gap: 1px; margin-left: auto; flex: none; opacity: 0; transition: opacity .12s; }
.grp-head:hover .grp-act { opacity: 1; }
.grp-act button {
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border-radius: 6px;
  color: var(--text-3);
  transition: background .12s, color .12s;
}
.grp-act button:hover { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.grp-act button.danger:hover { color: var(--red); }
.grp-rename {
  flex: 1;
  min-width: 0;
  height: 24px;
  padding: 0 7px;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 6px;
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-ring);
}

.grp-body { display: flex; flex-direction: column; gap: 6px; }
.grp.collapsed .grp-body { display: none; }
.grp-empty {
  display: grid;
  place-items: center;
  height: 42px;
  border: 1.5px dashed var(--border-strong);
  border-radius: 11px;
  font-size: 12px;
  color: var(--text-3);
  transition: border-color .12s, background .12s, color .12s;
}

/* 링크 행 */
.lk {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 50px;
  padding: 7px 8px 7px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: border-color .13s, box-shadow .13s;
  animation: pop .16s cubic-bezier(.16, 1, .3, 1);
}
@keyframes pop {
  from { opacity: 0; transform: translateY(-3px); }
  to   { opacity: 1; transform: none; }
}
.lk:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.lk.flash { animation: flash 1.1s ease-out; }
@keyframes flash {
  0%, 30% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  100%    { border-color: var(--border); box-shadow: var(--shadow-sm); }
}

.grip {
  flex: none;
  width: 14px;
  margin-left: -4px;
  margin-right: -4px;
  color: var(--text-3);
  opacity: 0;
  cursor: grab;
  transition: opacity .13s;
}
.lk:hover .grip { opacity: .8; }
body.searching .grip { display: none; }

.ava {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
}
.lk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lk-name, .lk-url {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lk-name { font-size: 13.5px; font-weight: 550; line-height: 1.35; }
.lk-url { font-size: 11.5px; color: var(--text-3); line-height: 1.4; }
.lk-open {
  flex: none;
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 7px;
  color: var(--text-3);
  opacity: 0;
  transition: opacity .13s, color .13s;
}
.lk:hover .lk-open { opacity: 1; color: var(--accent); }

mark {
  background: color-mix(in srgb, var(--accent) 24%, transparent);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
}

/* 드래그 - 메인 창과 같이 포인터 이벤트로 직접 처리해 커서를 grabbing 하나로 고정한다 */
body.dragging-active { user-select: none; }
body.dragging-active,
body.dragging-active * { cursor: grabbing !important; }
.lk.dragging { opacity: .35; }
.lk.drop-above::before,
.lk.drop-below::after {
  content: '';
  position: absolute;
  left: 2px;
  right: 2px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.lk.drop-above::before { top: -5px; }
.lk.drop-below::after { bottom: -5px; }
.grp.drop-into .grp-head { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.grp.drop-into .grp-name,
.grp.drop-into .fold { color: var(--accent); }
.grp.drop-into .grp-empty { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.empty {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding-bottom: 30px;
  color: var(--text-3);
  text-align: center;
}
.empty .t { font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.empty .s { font-size: 12px; }

/* ─────────── 추가 ─────────── */
footer {
  flex: none;
  padding: 10px 20px 16px;
  background: var(--bg);
  border-top: 1px solid var(--border);
}
.target-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: 0 0 7px 2px;
  font-size: 11.5px;
  color: var(--text-3);
}
.target-row[hidden] { display: none; }
#targetBtn {
  display: flex;
  align-items: center;
  gap: 3px;
  max-width: 220px;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--accent);
  transition: background .12s;
}
#targetBtn:hover { background: var(--accent-wash); }
#targetBtn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.field {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 6px 0 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  transition: border-color .14s, box-shadow .14s;
}
.field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.field.bad { border-color: var(--red); box-shadow: 0 0 0 3px rgba(184, 86, 77, .16); }
.field input {
  min-width: 0;
  height: 100%;
  padding: 0 12px;
  font: inherit;
  font-size: 13.5px;
  color: var(--text);
  background: none;
  border: none;
  outline: none;
}
.field input::placeholder { color: var(--text-3); }
#nameIn { flex: 2; padding-left: 14px; }
#urlIn { flex: 3; }
.vsep { flex: none; width: 1px; height: 20px; background: var(--border); }
.submit {
  flex: none;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  transition: background .14s, opacity .14s, transform .14s;
}
.submit:hover:not(:disabled) { background: var(--accent-hover); }
.submit:active:not(:disabled) { transform: scale(.94); }
.submit:disabled { opacity: .3; cursor: default; }
.hint {
  margin: 6px 0 -4px 2px;
  font-size: 11.5px;
  color: var(--red);
}
.hint[hidden] { display: none; }

/* ─────────── 떠 있는 것들 ─────────── */
#tip {
  position: fixed;
  z-index: 300;
  max-width: 300px;
  padding: 5px 9px;
  border-radius: 7px;
  background: var(--tip-bg);
  color: var(--tip-fg);
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: .01em;
  overflow-wrap: anywhere;
  box-shadow: var(--shadow-md);
  pointer-events: none;
}
#tip[hidden] { display: none; }

.menupop {
  position: fixed;
  z-index: 100;
  min-width: 168px;
  max-width: 260px;
  padding: 4px;
  background: #fdfdfc;
  border: 1px solid #d5d5cf;
  border-radius: 7px;
  box-shadow: 0 8px 22px -6px rgba(20, 20, 18, .22), 0 2px 6px rgba(20, 20, 18, .10);
  user-select: none;
}
.menupop[hidden] { display: none; }
.mi {
  display: flex;
  align-items: center;
  width: 100%;
  height: 28px;
  padding: 0 12px;
  border-radius: 4px;
  font-size: 12.5px;
  color: var(--text);
  text-align: left;
}
.mi span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi:hover { background: rgba(0, 0, 0, .07); }
.mi:disabled { color: var(--text-3); cursor: default; background: none; }
.mi.on { color: var(--accent); font-weight: 600; }
.mi.danger { color: var(--red); }
.mi.danger:hover { background: rgba(184, 86, 77, .12); }
.mi-sep { height: 1px; margin: 4px 8px; background: var(--border); }
.mi-head { padding: 4px 12px 2px; font-size: 11px; font-weight: 600; color: var(--text-3); }
.mi.indent { padding-left: 20px; }

/* 링크 수정 대화상자 - 메인 창의 링크 설정 대화상자와 같은 모양 */
.dlg-wrap {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(20, 20, 18, .28);
}
.dlg-wrap[hidden] { display: none; }
.dlg {
  width: min(380px, 100%);
  padding: 18px 18px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 16px 40px -10px rgba(20, 20, 18, .30), 0 2px 6px rgba(20, 20, 18, .08);
  animation: drop .16s cubic-bezier(.16, 1, .3, 1);
}
@keyframes drop {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: none; }
}
.dlg h2 { font-size: 15px; font-weight: 700; }
.dlg-field { display: block; margin-top: 14px; }
.dlg-field > span { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.dlg-field input {
  width: 100%;
  height: 34px;
  padding: 0 10px;
  font: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  outline: none;
  transition: border-color .12s, box-shadow .12s;
}
.dlg-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.dlg-field input.bad { border-color: var(--red); box-shadow: 0 0 0 3px rgba(184, 86, 77, .16); }
.dlg .hint { margin: 8px 0 0; }
.dlg-btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 16px; }
.dlg-btns button {
  height: 32px;
  padding: 0 14px;
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 8px;
  transition: background .12s, color .12s;
}
.dlg-btns .ghost { color: var(--text-2); }
.dlg-btns .ghost:hover { background: var(--surface-hover); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
.dlg-btns .primary { color: #fff; background: var(--accent); }
.dlg-btns .primary:hover { background: var(--accent-hover); }
.dlg-btns .primary:disabled { background: var(--text-3); cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <h1><span id="title"></span><span class="total" id="total"></span></h1>
      <button class="chip" id="newGroup">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span id="newGroupLabel"></span>
      </button>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false">
      <span class="q-count" id="qCount"></span>
      <button id="qClear" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <div id="list"></div>

  <footer>
    <div class="target-row" id="targetRow">
      <span id="targetLabel"></span>
      <button id="targetBtn">
        <span id="targetName"></span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <form class="field" id="addForm" autocomplete="off">
      <input id="nameIn" type="text" spellcheck="false">
      <span class="vsep"></span>
      <input id="urlIn" type="text" spellcheck="false" placeholder="https://">
      <button class="submit" id="addBtn" type="submit" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
    <p class="hint" id="addHint" hidden></p>
  </footer>
</div>

<div id="tip" hidden></div>
<div class="menupop" id="ctx" hidden></div>
<div class="dlg-wrap" id="editDlg" hidden>
  <form class="dlg" id="editForm" autocomplete="off">
    <h2 id="editTitle"></h2>
    <label class="dlg-field">
      <span id="editNameLabel"></span>
      <input id="editName" type="text" spellcheck="false">
    </label>
    <label class="dlg-field">
      <span id="editUrlLabel"></span>
      <input id="editUrl" type="text" spellcheck="false" placeholder="https://">
    </label>
    <p class="hint" id="editHint" hidden></p>
    <div class="dlg-btns">
      <button type="button" class="ghost" id="editCancel"></button>
      <button type="submit" class="primary" id="editSave"></button>
    </div>
  </form>
</div>

<script>
const STORE = 'links-v1';
const TARGET_KEY = 'links-target-v1';
// 맨 앞 그룹은 늘 '그룹 없음' 칸이다. 이름을 바꾸거나 지울 수 없고, 그룹을 지우면 링크가 여기로 온다.
const INBOX = 'inbox';

const I18N = {
  ko: {
    title: '링크 모음', total: n => n ? `${n}개` : '',
    newGroup: '새 그룹', newGroupName: '새 그룹', ungrouped: '그룹 없음',
    search: '이름이나 주소로 검색', hits: n => `${n}건`, clear: '지우기 (Esc)',
    namePh: '이름', urlPh: '주소',
    addTip: '추가 (Enter)', addTo: '추가할 그룹', badUrl: '주소가 올바르지 않습니다. 예: example.com',
    emptyTitle: '아직 모은 링크가 없습니다', emptySub: '아래에 이름과 주소를 넣어 추가하세요',
    noHitTitle: '검색 결과가 없습니다', noHitSub: '다른 낱말로 찾아보세요',
    dropHere: '링크를 여기로 끌어 놓으세요',
    open: '브라우저에서 열기', edit: '수정…', copy: '주소 복사', del: '삭제',
    rename: '이름 바꾸기', moveUp: '위로 옮기기', moveDown: '아래로 옮기기',
    delGroup: '그룹 삭제', moveTo: '다른 그룹으로 옮기기', delGroupTip: '그룹 삭제 · 링크는 \'그룹 없음\'으로 옮겨집니다',
    fold: '접기', unfold: '펼치기', dragTip: '드래그해서 옮기기',
    editTitle: '링크 수정', name: '이름', url: '주소', cancel: '취소', save: '저장',
  },
  en: {
    title: 'Links', total: n => n ? `${n}` : '',
    newGroup: 'New group', newGroupName: 'New group', ungrouped: 'Ungrouped',
    search: 'Search by name or URL', hits: n => `${n} result${n === 1 ? '' : 's'}`, clear: 'Clear (Esc)',
    namePh: 'Name', urlPh: 'URL',
    addTip: 'Add (Enter)', addTo: 'Add to', badUrl: 'That URL does not look right. e.g. example.com',
    emptyTitle: 'No links yet', emptySub: 'Enter a name and URL below to add one',
    noHitTitle: 'No results', noHitSub: 'Try a different word',
    dropHere: 'Drag links here',
    open: 'Open in browser', edit: 'Edit…', copy: 'Copy URL', del: 'Delete',
    rename: 'Rename', moveUp: 'Move up', moveDown: 'Move down',
    delGroup: 'Delete group', moveTo: 'Move to group', delGroupTip: 'Delete group · its links move to Ungrouped',
    fold: 'Collapse', unfold: 'Expand', dragTip: 'Drag to move',
    editTitle: 'Edit link', name: 'Name', url: 'URL', cancel: 'Cancel', save: 'Save',
  },
};
let lang = 'ko';
const L = () => I18N[lang];

const ICON = {
  grip:  '<svg width="11" height="15" viewBox="0 0 11 15" fill="currentColor"><circle cx="2.2" cy="2.2" r="1.4"/><circle cx="8.8" cy="2.2" r="1.4"/><circle cx="2.2" cy="7.5" r="1.4"/><circle cx="8.8" cy="7.5" r="1.4"/><circle cx="2.2" cy="12.8" r="1.4"/><circle cx="8.8" cy="12.8" r="1.4"/></svg>',
  chev:  '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  jump:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>',
  pen:   '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  link:  '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  find:  '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>',
};

const $ = id => document.getElementById(id);
const list = $('list'), q = $('q'), nameIn = $('nameIn'), urlIn = $('urlIn'), addBtn = $('addBtn');

let groups = load();
let target = INBOX;
try { target = localStorage.getItem(TARGET_KEY) || INBOX; } catch {}
let menuState = { deleteLock: false };
let drag = null;
let dropAt = null;
let scrollDir = 0;
let lastX = 0, lastY = 0;
let justDragged = false;

/* ─── 저장 ─── */
function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE)); } catch {}
  const gs = Array.isArray(raw?.groups) ? raw.groups : [];
  if (gs[0]?.id !== INBOX) gs.unshift({ id: INBOX, name: '', links: [] });
  gs.forEach(g => { if (!Array.isArray(g.links)) g.links = []; });
  return gs;
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ groups })); } catch {}
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const groupById = id => groups.find(g => g.id === id);
const groupName = g => g.id === INBOX ? L().ungrouped : g.name;
const hasUserGroups = () => groups.length > 1;

function setTarget(id) {
  target = groupById(id) ? id : INBOX;
  try { localStorage.setItem(TARGET_KEY, target); } catch {}
}

/* ─── 주소 ─── */
// 'example.com' 처럼 스킴 없이 넣어도 https 로 받아 준다. 브라우저로 넘길 수 있는 http(s) 만 허용한다.
function normalizeUrl(s) {
  s = s.trim();
  if (!s || /\s/.test(s)) return null;
  if (!/^[a-z][\w+.-]*:\/\//i.test(s)) s = 'https://' + s;
  try {
    const u = new URL(s);
    if (!/^https?:$/.test(u.protocol) || !u.hostname.includes('.') && u.hostname !== 'localhost') return null;
    return u.href;
  } catch { return null; }
}
// 목록에 보일 짧은 주소 - 스킴, www., 끝의 / 를 뗀다
function shortUrl(href) {
  try {
    const u = new URL(href);
    const rest = (u.pathname + u.search + u.hash).replace(/\/$/, '');
    return u.host.replace(/^www\./, '') + rest;
  } catch { return href; }
}
function defaultName(href) {
  try { return new URL(href).hostname.replace(/^www\./, ''); } catch { return href; }
}

/* ─── 검색 ─── */
const query = () => q.value.trim().toLowerCase();
const matches = (lk, s) => lk.name.toLowerCase().includes(s) || lk.url.toLowerCase().includes(s)
  || shortUrl(lk.url).toLowerCase().includes(s);

// 처음 일치하는 부분만 <mark> 로 감싼다. innerHTML 을 쓰지 않아 이름이 마크업이 되지 않는다.
function marked(text, s) {
  const frag = document.createDocumentFragment();
  const i = s ? text.toLowerCase().indexOf(s) : -1;
  if (i < 0) { frag.append(text); return frag; }
  const m = document.createElement('mark');
  m.textContent = text.slice(i, i + s.length);
  frag.append(text.slice(0, i), m, text.slice(i + s.length));
  return frag;
}

/* ─── 그리기 ─── */
function applyStaticText() {
  $('title').textContent = L().title;
  $('newGroupLabel').textContent = L().newGroup;
  q.placeholder = L().search;
  $('qClear').dataset.tip = L().clear;
  nameIn.placeholder = L().namePh;
  urlIn.placeholder = L().urlPh;
  addBtn.dataset.tip = L().addTip;
  $('targetLabel').textContent = L().addTo;
  document.documentElement.lang = lang;
}

function render() {
  applyStaticText();
  if (!groupById(target)) setTarget(INBOX);

  const s = query();
  const total = groups.reduce((n, g) => n + g.links.length, 0);
  $('total').textContent = L().total(total);
  $('qClear').hidden = !q.value;
  document.body.classList.toggle('searching', !!s);

  $('targetRow').hidden = !hasUserGroups();
  $('targetName').textContent = groupName(groupById(target));

  const scroll = list.scrollTop;
  list.innerHTML = '';

  if (!total && !hasUserGroups()) {
    list.append(emptyState(ICON.link, L().emptyTitle, L().emptySub));
    $('qCount').textContent = '';
    return;
  }

  let hits = 0;
  groups.forEach((g, gi) => {
    const shown = s ? g.links.filter(lk => matches(lk, s)) : g.links;
    hits += shown.length;
    // 검색 중에는 걸린 링크가 있는 그룹만 보여준다
    if (s && !shown.length) return;
    // 그룹을 만들지 않았으면 '그룹 없음' 머리 없이 링크만 늘어놓는다
    if (g.id === INBOX && !hasUserGroups()) {
      const body = document.createElement('div');
      body.className = 'grp inbox bare';
      body.dataset.gi = gi;
      const inner = document.createElement('div');
      inner.className = 'grp-body';
      shown.forEach(lk => inner.append(linkRow(lk, gi, s)));
      body.append(inner);
      list.append(body);
      return;
    }
    // 비어 있는 '그룹 없음' 은 자리만 차지하므로 숨긴다 - 끌어 옮길 때만 드러낸다
    if (g.id === INBOX && !g.links.length) return;
    list.append(groupSection(g, gi, shown, s));
  });

  $('qCount').textContent = s ? L().hits(hits) : '';
  if (s && !hits) list.append(emptyState(ICON.find, L().noHitTitle, L().noHitSub));
  list.scrollTop = scroll;

  // 말줄임된 것만 툴팁으로 전체를 보여준다. 늘 띄우면 행마다 그룹 머리를 가린다.
  const cut = el => el.scrollWidth > el.clientWidth + 1;
  list.querySelectorAll('.grp-name').forEach(el => { if (cut(el)) el.dataset.tip = el.textContent; });
  list.querySelectorAll('.lk').forEach(row => {
    const name = row.querySelector('.lk-name'), url = row.querySelector('.lk-url');
    if (cut(name)) row.dataset.tip = `${name.textContent} · ${url.textContent}`;
    else if (cut(url)) row.dataset.tip = url.textContent;
  });
}

function emptyState(icon, t, sub) {
  const el = document.createElement('div');
  el.className = 'empty';
  el.innerHTML = `${icon}<div><div class="t"></div><div class="s"></div></div>`;
  el.querySelector('.t').textContent = t;
  el.querySelector('.s').textContent = sub;
  return el;
}

function groupSection(g, gi, shown, s) {
  const sec = document.createElement('section');
  const collapsed = g.collapsed && !s;
  sec.className = 'grp' + (g.id === INBOX ? ' inbox' : '') + (collapsed ? ' collapsed' : '')
    + (g.id === target && hasUserGroups() ? ' target' : '');
  sec.dataset.gi = gi;

  const head = document.createElement('div');
  head.className = 'grp-head';
  head.innerHTML = `
    <span class="fold">${ICON.chev}</span>
    <span class="grp-name"></span>
    <span class="cnt"></span>
    ${g.id === INBOX ? '' : `<span class="grp-act">
      <button class="ren">${ICON.pen}</button>
      <button class="del danger">${ICON.trash}</button>
    </span>`}`;
  head.querySelector('.grp-name').textContent = groupName(g);
  head.querySelector('.cnt').textContent = s ? `${shown.length}/${g.links.length}` : g.links.length;
  head.querySelector('.fold').dataset.tip = collapsed ? L().unfold : L().fold;

  head.onclick = () => {
    if (s) return;
    g.collapsed = !g.collapsed;
    save(); render();
  };
  if (g.id !== INBOX) {
    const ren = head.querySelector('.ren');
    ren.dataset.tip = L().rename;
    ren.onclick = e => { e.stopPropagation(); startRename(sec, g); };
    const del = head.querySelector('.del');
    del.dataset.tip = L().delGroupTip;
    del.onclick = e => { e.stopPropagation(); deleteGroup(g); };
    head.querySelector('.grp-name').ondblclick = e => { e.stopPropagation(); startRename(sec, g); };
  }
  head.oncontextmenu = e => {
    e.preventDefault();
    const ui = groups.indexOf(g);
    const entries = [];
    if (g.id !== INBOX) {
      entries.push(
        { label: L().rename, run: () => startRename(sec, g) },
        { label: L().moveUp, disabled: ui <= 1, run: () => moveGroup(ui, -1) },
        { label: L().moveDown, disabled: ui >= groups.length - 1, run: () => moveGroup(ui, 1) },
        { sep: true },
        { label: L().delGroup, danger: true, run: () => deleteGroup(g) },
      );
    } else {
      entries.push({ label: collapsed ? L().unfold : L().fold, run: () => head.onclick() });
    }
    openCtx(e.clientX, e.clientY, entries);
  };

  const body = document.createElement('div');
  body.className = 'grp-body';
  if (!shown.length) {
    const ph = document.createElement('div');
    ph.className = 'grp-empty';
    ph.textContent = L().dropHere;
    body.append(ph);
  }
  shown.forEach(lk => body.append(linkRow(lk, gi, s)));

  sec.append(head, body);
  return sec;
}

function linkRow(lk, gi, s) {
  const row = document.createElement('div');
  row.className = 'lk';
  row.dataset.id = lk.id;
  row.innerHTML = `
    <span class="grip">${ICON.grip}</span>
    <span class="ava"></span>
    <span class="lk-main"><span class="lk-name"></span><span class="lk-url"></span></span>
    <span class="lk-open">${ICON.jump}</span>`;
  row.querySelector('.grip').dataset.tip = L().dragTip;
  // 첫 글자 - 이모지나 한글도 한 글자로 잘리도록 코드포인트 단위로 자른다
  row.querySelector('.ava').textContent = [...lk.name.trim()][0]?.toUpperCase() || '?';
  row.querySelector('.lk-name').append(marked(lk.name, s));
  row.querySelector('.lk-url').append(marked(shortUrl(lk.url), s));

  row.onclick = () => { if (!justDragged) openLink(lk); };
  row.oncontextmenu = e => {
    e.preventDefault();
    const entries = [
      { label: L().open, run: () => openLink(lk) },
      { label: L().copy, run: () => navigator.clipboard?.writeText(lk.url).catch(() => {}) },
      { label: L().edit, run: () => openEdit(lk) },
    ];
    if (hasUserGroups()) {
      // 드래그 말고도 옮길 수 있게 - 지금 그룹을 빼고 나머지를 늘어놓는다
      entries.push({ sep: true }, { heading: L().moveTo });
      groups.forEach((g, to) => {
        if (to === gi) return;
        entries.push({ label: groupName(g), indent: true, run: () => moveLink(gi, groups[gi].links.indexOf(lk), to, g.links.length) });
      });
    }
    if (!menuState.deleteLock) {
      entries.push({ sep: true }, {
        label: L().del,
        danger: true,
        run: () => {
          groups[gi].links = groups[gi].links.filter(x => x !== lk);
          save(); render();
        },
      });
    }
    openCtx(e.clientX, e.clientY, entries);
  };
  // 검색 중에는 보이는 순서가 실제 순서와 달라 끌어 옮기지 않는다
  row.onpointerdown = e => {
    if (e.button !== 0 || query()) return;
    drag = { gi, li: groups[gi].links.indexOf(lk), row, startY: e.clientY, moved: false };
  };
  return row;
}

// a target=_blank 로 열면 main 의 창 열기 처리가 받아 기본 브라우저로 넘긴다
function openLink(lk) {
  window.open(lk.url, '_blank');
}

/* ─── 추가 ─── */
function checkAdd() {
  const raw = urlIn.value.trim();
  const ok = !!normalizeUrl(raw);
  addBtn.disabled = !ok;
  return ok;
}
function showAddHint(on) {
  $('addForm').classList.toggle('bad', on);
  $('addHint').hidden = !on;
  $('addHint').textContent = L().badUrl;
}

function addLink() {
  const url = normalizeUrl(urlIn.value);
  if (!url) { if (urlIn.value.trim()) showAddHint(true); urlIn.focus(); return; }
  const lk = { id: uid(), name: nameIn.value.trim() || defaultName(url), url };
  const g = groupById(target);
  g.links.push(lk);
  g.collapsed = false;
  nameIn.value = urlIn.value = '';
  checkAdd();
  showAddHint(false);
  // 검색에 걸리지 않아 새 링크가 안 보이는 일이 없도록 검색을 비운다
  q.value = '';
  save(); render();
  const row = list.querySelector(`.lk[data-id="${lk.id}"]`);
  if (row) {
    row.scrollIntoView({ block: 'nearest' });
    row.classList.add('flash');
  }
  nameIn.focus();
}

$('addForm').onsubmit = e => { e.preventDefault(); addLink(); };
urlIn.oninput = () => { checkAdd(); showAddHint(false); };
nameIn.onkeydown = e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  // 이름칸에 주소를 붙여 넣고 바로 Enter 를 친 경우 - 주소칸으로 옮겨 준다
  if (!urlIn.value.trim() && /^https?:\/\//i.test(nameIn.value.trim())) {
    urlIn.value = nameIn.value.trim();
    nameIn.value = '';
    checkAdd();
  }
  urlIn.value.trim() ? addLink() : urlIn.focus();
};

$('targetBtn').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  openCtx(r.left, r.top, groups.map(g => ({
    label: groupName(g), on: g.id === target,
    run: () => { setTarget(g.id); render(); nameIn.focus(); },
  })), true);
};

/* ─── 그룹 ─── */
$('newGroup').onclick = () => {
  const g = { id: uid(), name: L().newGroupName, links: [] };
  groups.push(g);
  save();
  q.value = '';
  render();
  const sec = list.querySelector(`.grp[data-gi="${groups.length - 1}"]`);
  sec.scrollIntoView({ block: 'nearest' });
  startRename(sec, g, true);
};

function startRename(sec, g, isNew = false) {
  const head = sec.querySelector('.grp-head');
  const name = head.querySelector('.grp-name');
  const act = head.querySelector('.grp-act');
  const inp = document.createElement('input');
  inp.className = 'grp-rename';
  inp.value = g.name;
  inp.spellcheck = false;
  name.replaceWith(inp);
  act?.remove();
  head.querySelector('.cnt').hidden = true;
  head.onclick = null;
  inp.focus();
  inp.select();

  let closed = false;
  const commit = () => {
    if (closed) return;
    closed = true;
    const v = inp.value.trim();
    if (v) g.name = v;
    // 새로 만든 그룹은 곧바로 링크를 넣을 곳으로 삼는다
    if (isNew) setTarget(g.id);
    save(); render();
  };
  inp.onclick = e => e.stopPropagation();
  inp.onblur = commit;
  inp.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') { if (isNew) commit(); else { closed = true; render(); } }
  };
}

// 지운 그룹의 링크는 '그룹 없음' 으로 옮긴다 - 링크가 사라지지 않으니 따로 묻지 않는다
function deleteGroup(g) {
  groups[0].links.push(...g.links);
  groups = groups.filter(x => x !== g);
  if (target === g.id) setTarget(INBOX);
  save(); render();
}

function moveGroup(i, dir) {
  const j = i + dir;
  if (j < 1 || j >= groups.length) return;
  [groups[i], groups[j]] = [groups[j], groups[i]];
  save(); render();
}

function moveLink(fromG, fromI, toG, toI) {
  if (fromI < 0) return;
  const [lk] = groups[fromG].links.splice(fromI, 1);
  if (fromG === toG && toI > fromI) toI--;
  groups[toG].links.splice(toI, 0, lk);
  save(); render();
  const row = list.querySelector(`.lk[data-id="${lk.id}"]`);
  if (row) row.classList.add('flash');
}

/* ─── 드래그 ───
   놓을 자리: 행 위/아래(선), 그룹 머리나 빈 그룹(그룹 끝에 넣기). */
function updateDrop(x, y) {
  clearDropMarks();
  dropAt = null;
  const secs = [...list.querySelectorAll('.grp')];
  const sec = secs.find(el => { const r = el.getBoundingClientRect(); return y >= r.top && y < r.bottom; });
  if (!sec) return;
  const gi = +sec.dataset.gi;
  const head = sec.querySelector('.grp-head');
  const rows = sec.classList.contains('collapsed') ? [] : [...sec.querySelectorAll('.lk')];
  const same = gi === drag.gi;

  const into = () => {
    const to = groups[gi].links.length;
    if (same && (to === drag.li || to === drag.li + 1)) return;
    dropAt = { gi, li: to };
    sec.classList.add('drop-into');
  };

  if (!rows.length || (head && y < head.getBoundingClientRect().bottom)) return into();

  let i = rows.findIndex(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
  if (i < 0) i = rows.length;
  if (same && (i === drag.li || i === drag.li + 1)) return;
  dropAt = { gi, li: i };
  if (i < rows.length) rows[i].classList.add('drop-above');
  else rows[rows.length - 1].classList.add('drop-below');
}

function clearDropMarks() {
  list.querySelectorAll('.drop-above, .drop-below, .drop-into')
      .forEach(el => el.classList.remove('drop-above', 'drop-below', 'drop-into'));
}

function tickAutoScroll() {
  if (!drag) return;
  if (drag.moved && scrollDir) {
    list.scrollTop += scrollDir * 7;
    updateDrop(lastX, lastY);
  }
  requestAnimationFrame(tickAutoScroll);
}

addEventListener('pointermove', e => {
  if (!drag) return;
  lastX = e.clientX; lastY = e.clientY;
  if (!drag.moved) {
    if (Math.abs(e.clientY - drag.startY) < 4) return;
    drag.moved = true;
    closeCtx();
    hideTip();
    drag.row.classList.add('dragging');
    document.body.classList.add('dragging-active');
    // 숨겨 둔 빈 '그룹 없음' 칸을 끌어 놓을 곳으로 맨 아래에 드러낸다
    revealInbox();
    requestAnimationFrame(tickAutoScroll);
  }
  const r = list.getBoundingClientRect();
  scrollDir = e.clientY < r.top + 26 ? -1 : e.clientY > r.bottom - 26 ? 1 : 0;
  updateDrop(e.clientX, e.clientY);
});

addEventListener('pointerup', () => {
  if (!drag) return;
  const { gi, li, moved } = drag;
  drag = null;
  scrollDir = 0;
  document.body.classList.remove('dragging-active');
  if (!moved) return;
  justDragged = true;
  setTimeout(() => { justDragged = false; }, 80);
  if (dropAt) moveLink(gi, li, dropAt.gi, dropAt.li);
  else render();
  dropAt = null;
});

// 드래그 도중에 목록을 다시 그리면 끌고 있는 행을 잃는다 - 칸 하나만 덧붙인다.
// 위에 끼우면 목록 전체가 밀려 내려가므로 맨 아래에 붙인다.
function revealInbox() {
  if (!hasUserGroups() || groups[0].links.length || list.querySelector('.grp.inbox')) return;
  list.append(groupSection(groups[0], 0, [], ''));
}

/* ─── 우클릭 메뉴 ─── */
const ctx = $('ctx');
function openCtx(x, y, entries, above = false) {
  ctx.innerHTML = '';
  entries.forEach(spec => {
    if (spec.sep) {
      const s = document.createElement('div');
      s.className = 'mi-sep';
      ctx.append(s);
      return;
    }
    if (spec.heading) {
      const h = document.createElement('div');
      h.className = 'mi-head';
      h.textContent = spec.heading;
      ctx.append(h);
      return;
    }
    const mi = document.createElement('button');
    mi.className = 'mi' + (spec.danger ? ' danger' : '') + (spec.on ? ' on' : '') + (spec.indent ? ' indent' : '');
    mi.disabled = !!spec.disabled;
    const t = document.createElement('span');
    t.textContent = spec.label;
    mi.append(t);
    mi.onclick = ev => { ev.stopPropagation(); closeCtx(); spec.run(); };
    ctx.append(mi);
  });
  ctx.hidden = false;
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  ctx.style.left = `${Math.max(6, Math.min(x, innerWidth - w - 6))}px`;
  const top = above ? y - h - 4 : (y + h > innerHeight ? y - h : y);
  ctx.style.top = `${Math.max(6, Math.min(top, innerHeight - h - 6))}px`;
}
function closeCtx() { ctx.hidden = true; }

/* ─── 링크 수정 ─── */
const editDlg = $('editDlg'), editName = $('editName'), editUrl = $('editUrl');
let editing = null;

function openEdit(lk) {
  editing = lk;
  $('editTitle').textContent = L().editTitle;
  $('editNameLabel').textContent = L().name;
  $('editUrlLabel').textContent = L().url;
  $('editCancel').textContent = L().cancel;
  $('editSave').textContent = L().save;
  editName.value = lk.name;
  editUrl.value = lk.url;
  checkEdit();
  hideTip();
  editDlg.hidden = false;
  editName.focus();
  editName.select();
}
function checkEdit() {
  const bad = !normalizeUrl(editUrl.value);
  editUrl.classList.toggle('bad', bad);
  $('editHint').hidden = !bad;
  $('editHint').textContent = L().badUrl;
  $('editSave').disabled = bad;
}
function closeEdit() {
  editDlg.hidden = true;
  editing = null;
}
editUrl.oninput = checkEdit;
$('editCancel').onclick = closeEdit;
editDlg.onmousedown = e => { editDlg.dataset.downOut = e.target === editDlg ? '1' : ''; };
editDlg.onclick = e => { if (e.target === editDlg && editDlg.dataset.downOut) closeEdit(); };
$('editForm').onsubmit = e => {
  e.preventDefault();
  const url = normalizeUrl(editUrl.value);
  if (!url || !editing) return;
  editing.url = url;
  editing.name = editName.value.trim() || defaultName(url);
  closeEdit();
  save(); render();
};

/* ─── 툴팁 ─── */
const tipEl = $('tip');
let tipFor = null;
function showTip(el) {
  tipEl.textContent = el.dataset.tip;
  tipEl.hidden = false;
  const r = el.getBoundingClientRect();
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const left = Math.max(6, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 6));
  const above = r.top - h - 6;
  tipEl.style.left = `${left}px`;
  tipEl.style.top = `${above < 6 ? r.bottom + 6 : above}px`;
}
function hideTip() { tipEl.hidden = true; tipFor = null; }
addEventListener('mouseover', e => {
  if (drag?.moved) return;
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el === tipFor) return;
  tipFor = el;
  el ? showTip(el) : hideTip();
});
addEventListener('mousedown', e => {
  hideTip();
  if (!ctx.hidden && !ctx.contains(e.target)) closeCtx();
});
addEventListener('wheel', hideTip, { passive: true });
addEventListener('blur', () => { hideTip(); closeCtx(); });

/* ─── 검색·키 ─── */
q.oninput = render;
$('qClear').onclick = () => { q.value = ''; render(); q.focus(); };

addEventListener('keydown', e => {
  if (!editDlg.hidden) {
    if (e.key === 'Escape') closeEdit();
    return;
  }
  if (e.ctrlKey && !e.altKey && !e.metaKey && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    q.focus();
    q.select();
    return;
  }
  if (e.key === 'Escape') {
    if (!ctx.hidden) closeCtx();
    else if (q.value) { q.value = ''; render(); q.focus(); }
  }
});

list.onscroll = hideTip;

if (window.appMenu) {
  appMenu.state().then(s => { menuState = s; lang = s.lang; render(); });
  appMenu.onState(s => { menuState = s; lang = s.lang; render(); });
}
render();
q.blur();
nameIn.focus();
</script>
</body>
